<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — ARGOS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-panel">
    <div class="login-brand">
      <h1>ARGOS</h1>
      <p>Sistema de Controle de Acesso e Monitoramento</p>
    </div>
    <p id="error" class="feedback error" role="alert" hidden></p>
    <form id="login-form">
      <label for="username">Usuário</label>
      <input type="text" id="username" name="username" required autofocus>

      <label for="password">Senha</label>
      <div class="password-wrap">
        <input type="password" id="password" name="password" required>
        <button type="button" id="toggle-password" aria-label="Exibir senha">Mostrar</button>
      </div>

      <button type="submit" id="btn-login" class="btn" style="width: 100%; margin-top: .8rem;">Entrar</button>
    </form>
  </div>
  <script>
    const form = document.getElementById("login-form");
    const errEl = document.getElementById("error");
    const btnLogin = document.getElementById("btn-login");
    const passwordInput = document.getElementById("password");
    const btnToggle = document.getElementById("toggle-password");

    function setError(message) {
      errEl.textContent = message;
      errEl.hidden = !message;
    }

    btnToggle.addEventListener("click", () => {
      const isHidden = passwordInput.type === "password";
      passwordInput.type = isHidden ? "text" : "password";
      btnToggle.textContent = isHidden ? "Ocultar" : "Mostrar";
      btnToggle.setAttribute("aria-label", isHidden ? "Ocultar senha" : "Exibir senha");
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      setError("");
      btnLogin.disabled = true;
      btnLogin.textContent = "Entrando...";

      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value,
            password: passwordInput.value,
          }),
        });

        if (res.ok) {
          window.location.href = "/";
          return;
        }

        let data = {};
        try {
          data = await res.json();
        } catch (_ignore) {}
        if (res.status === 401) {
          setError("Usuário ou senha inválidos.");
          return;
        }
        setError(data.error || "Falha ao autenticar. Tente novamente.");
      } catch (_err) {
        setError("API indisponível no momento. Verifique a conexão e tente novamente.");
      } finally {
        btnLogin.disabled = false;
        btnLogin.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
