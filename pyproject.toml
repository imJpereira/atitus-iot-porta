[project]
name = "atitus-iot-porta"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "gunicorn>=26.2.0",
]

[dependency-groups]
dev = [
    "pandas>=3.1.0",
    "pytest>=9.2.0",
]
rasp = [
    "mfrc522>=0.0.7",
    "rpi-gpio>=0.7.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
